<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071d1b" />
    <title>3Dワールド | Wakuwaku Quest</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="quest-inventory.css" />
    <link rel="stylesheet" href="castle-walk.css" />
    <script type="importmap">{"imports":{"three":"./assets/vendor/three/three.module.js"}}</script>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; overflow: hidden; color: #f3fff8; background: radial-gradient(circle at 50% 24%, #29634f 0, #0b2726 40%, #03090b 100%); }
      model-viewer { width: 100%; height: 100svh; --poster-color: transparent; }
      .topbar { position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
      .title { max-width: 74%; text-shadow: 0 2px 12px #000; }
      .title small, .title strong { display: block; }
      .title small { color: #bdebd9; font-size: 12px; font-weight: 900; letter-spacing: .12em; }
      .title strong { margin-top: 3px; font-size: clamp(22px, 7vw, 36px); line-height: 1.1; }
      .back { pointer-events: auto; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; color: #fff; background: rgba(2,15,16,.68); text-decoration: none; backdrop-filter: blur(10px); font-weight: 900; }
      .hint { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: calc(126px + env(safe-area-inset-bottom)); margin: auto; max-width: 560px; padding: 10px 14px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; color: #d7eee7; background: rgba(2,15,16,.66); font-size: 12px; line-height: 1.6; text-align: center; backdrop-filter: blur(12px); pointer-events: none; }
      .ar-button { position: fixed; z-index: 3; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); min-height: 52px; padding: 0 24px; border: 1px solid rgba(255,231,160,.7); border-radius: 999px; color: #fff; background: linear-gradient(135deg, #138463, #2c7bd0); box-shadow: 0 12px 32px rgba(0,0,0,.42); font: inherit; font-weight: 900; transform: translateX(-50%); white-space: nowrap; }
      .walk-controls { position: fixed; z-index: 3; left: 12px; right: 12px; bottom: calc(68px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; overflow-x: auto; padding: 4px 2px; }
      .walk-controls button { flex: 0 0 auto; min-height: 42px; padding: 0 14px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #effff8; background: rgba(2,15,16,.72); box-shadow: 0 8px 22px rgba(0,0,0,.26); font: inherit; font-size: 13px; font-weight: 900; backdrop-filter: blur(12px); }
      .walk-controls button.active { color: #17352d; background: #dffbe9; }
      .progress { position: absolute; left: 10%; right: 10%; bottom: 8px; height: 3px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.15); }
      .progress span { display: block; width: 0; height: 100%; background: #79e6cf; transition: width .2s; }
      .world-item-hotspot { display: grid; min-width: 58px; min-height: 58px; place-items: center; border: 2px solid rgba(255,255,255,.92); border-radius: 50%; color: #17352d; background: radial-gradient(circle at 32% 26%, #fff 0 16%, #ffe27a 17% 48%, #22c08f 49% 100%); box-shadow: 0 10px 28px rgba(0,0,0,.34), 0 0 0 10px rgba(255,226,122,.18); font: inherit; font-size: 12px; font-weight: 1000; cursor: pointer; transform: translate(-50%, -50%); animation: pulse 1.8s ease-in-out infinite; }
      .world-item-hotspot span { display: block; padding-top: 2px; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
      .item-panel { position: fixed; z-index: 4; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); display: none; margin: auto; max-width: 560px; padding: 16px; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; color: #f7fff9; background: rgba(4,24,21,.86); box-shadow: 0 18px 46px rgba(0,0,0,.42); backdrop-filter: blur(14px); }
      .item-panel.visible { display: block; }
      .item-panel small { display: block; color: #9ee5cb; font-weight: 900; letter-spacing: .12em; }
      .item-panel strong { display: block; margin-top: 4px; font-size: 22px; }
      .item-panel p { margin: 8px 0 0; color: #d8eee5; line-height: 1.7; }
      .item-panel button { margin-top: 12px; min-height: 40px; padding: 0 16px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #17352d; background: #dffbe9; font: inherit; font-weight: 900; }
      .error { display: grid; min-height: 100svh; place-items: center; padding: 24px; text-align: center; }
      .error div { max-width: 520px; padding: 22px; border: 1px solid rgba(255,255,255,.16); border-radius: 18px; background: rgba(2,15,16,.7); }
      @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }
    </style>
  </head>
  <body class="entry-locked">
    <style>
      .entry-locked model-viewer, .entry-locked .walk-controls, .entry-locked .hint, .entry-locked .item-panel { display: none; }
      .entry-gate { min-height: 100svh; display: grid; place-content: center; gap: 16px; padding: 88px 24px 24px; text-align: center; }
      .entry-gate p { max-width: 520px; line-height: 1.8; }
      .entry-gate button { min-height: 48px; padding: 12px 20px; border: 0; border-radius: 8px; background: #dffbe9; color: #17352d; font: inherit; font-weight: 700; }
      .entry-gate[hidden] { display: none; }
    </style>
    <div class="topbar">
      <div class="title"><small>3D WORLD ENTRANCE</small><strong id="world-title">3Dワールド</strong></div>
      <a class="back" href="/?return=map" aria-label="地図へ戻る">×</a>
    </div>
    <section class="entry-gate" id="entry-gate">
      <h1 id="entry-heading">現地限定ワールド</h1>
      <p id="entry-status" role="status"></p>
      <button id="entry-check" type="button">現在地を確認して入る</button>
    </section>
    <model-viewer
      id="world-model"
      alt="探究ポイントの3Dワールド"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      camera-controls
      autoplay
      shadow-intensity="1.2"
      environment-image="neutral"
      exposure="1.1">
      <button class="ar-button" slot="ar-button">現地に出現させる</button>
      <div class="progress" slot="progress-bar"><span></span></div>
    </model-viewer>
    <nav class="walk-controls" aria-label="3Dワールド内を移動">
      <a id="shared-avatar" href="world-avatar.html">共通アバター</a>
      <button type="button" data-walk-point="gate">入口</button>
      <button type="button" data-walk-point="front">正面</button>
      <button type="button" data-walk-point="floor1">1階</button>
      <button type="button" data-walk-point="floor2">2階</button>
      <button type="button" data-walk-point="item">アイテム</button>
    </nav>
    <p class="hint">下のボタンで歩く位置を変えられます。ドラッグで回転、ピンチで少し拡大できます。</p>
    <section id="item-panel" class="item-panel" aria-live="polite">
      <small>ITEM FOUND</small>
      <strong id="item-title">2階のひみつアイテム</strong>
      <p id="item-text">2階に隠された探究アイテムを見つけました。現地で気づいたことを記録すると、この場所の謎がひとつ開きます。</p>
      <button id="item-close" type="button">地図にもどる前に観察する</button>
    </section>
    <button class="world-inventory" type="button" data-quest-inventory aria-label="もちもの" title="もちもの"><img src="assets/account.svg" width="24" height="24" alt="" /></button>
    <script src="public-config.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="world-access.js"></script>
    <script src="world-destinations.js"></script>
    <script src="sanctuary-sky.js"></script>
    <script>
      document.querySelector('#shared-avatar').href = 'world-avatar.html?returnTo=' + encodeURIComponent(location.href);
    </script>
    <script>
      const params = new URLSearchParams(location.search);
      const rawSrc = (params.get("src") || "").trim();
      const title = (params.get("title") || "3Dワールド").trim();
      const viewer = document.querySelector("#world-model");
      const titleEl = document.querySelector("#world-title");
      const bar = document.querySelector(".progress span");
      const itemPanel = document.querySelector("#item-panel");
      const itemTitle = document.querySelector("#item-title");
      const itemText = document.querySelector("#item-text");
      const itemClose = document.querySelector("#item-close");
      const walkButtons = [...document.querySelectorAll("[data-walk-point]")];

      function resolveModelSrc(src) {
        if (!src) return "";
        if (/^https?:\/\//i.test(src)) return src;
        if (src.startsWith("/")) return src;
        if (src.startsWith("assets/")) return `/${src}`;
        return "";
      }

      titleEl.textContent = title;
      document.title = `${title} | Wakuwaku Quest`;
      const modelSrc = resolveModelSrc(rawSrc);
      const skyline = window.SanctuarySky?.resolve(params, location.href);
      if (skyline) {
        viewer.setAttribute("skybox-image", skyline.image);
        // Keep neutral indoor lighting; the panorama supplies the distant view.
        document.querySelector('.hint').textContent = skyline.hint;
      }
      if (!modelSrc) {
        document.body.innerHTML = '<main class="error"><div><h1>3Dモデルが見つかりません</h1><p>探究ポイントの3DモデルURLを確認してください。</p><p><a class="back" href="/?return=map" aria-label="地図へ戻る">×</a></p></div></main>';
      }

      const kids = params.get("kids") === "1";
      const entrance = WorldAccess.position({ lat: params.get("lat"), lng: params.get("lng") });
      const gate = document.querySelector("#entry-gate");
      const entryStatus = document.querySelector("#entry-status");
      const entryButton = document.querySelector("#entry-check");
      let entryWatch = null;
      let entryTimer = null;
      let lastFix = null;
      function lockEntry(result) {
        document.body.classList.add("entry-locked");
        viewer.removeAttribute("src");
        itemPanel.classList.remove("visible");
        viewer.querySelectorAll(".world-item-hotspot").forEach((item) => item.remove());
        if (entryWatch !== null) navigator.geolocation.clearWatch(entryWatch);
        entryWatch = null;
        clearInterval(entryTimer);
        entryTimer = null;
        if (gate) gate.hidden = false;
        if (entryStatus) entryStatus.textContent = WorldAccess.message(result, kids);
      }
      function acceptFix(fix) {
        const result = WorldAccess.assess(entrance, fix);
        if (!result.allowed) { lockEntry(result); return false; }
        lastFix = fix;
        document.body.classList.remove("entry-locked");
        gate.hidden = true;
        const hosted = window.WorldDestinations?.hostedUrl(modelSrc);
        if (hosted) {
          const destination = new URL(hosted);
          const avatarId = new URLSearchParams(location.search).get('avatar');
          if (avatarId) destination.hash = new URLSearchParams({ avatar: avatarId }).toString();
          location.replace(destination.href); return true;
        }
        if (!viewer.getAttribute("src")) viewer.src = modelSrc;
        return true;
      }
      if (modelSrc && gate && !WorldAccess.requiresLocation()) {
        document.body.classList.remove("entry-locked");
        gate.hidden = true;
        viewer.src = modelSrc;
      }
      if (modelSrc && gate && WorldAccess.requiresLocation()) {
        if (kids) {
          document.querySelector("#entry-heading").textContent = "げんちで はいれる せかい";
          entryButton.textContent = "いまいる ばしょを たしかめる";
        }
        lockEntry(WorldAccess.assess(entrance, null));
        entryButton.disabled = !entrance;
        entryButton.addEventListener("click", async () => {
          entryButton.disabled = true;
          entryStatus.textContent = kids ? "ばしょを たしかめています…" : "現在地を確認中…";
          try {
            const fix = await WorldAccess.locate();
            if (document.hidden || !acceptFix(fix)) return;
            entryWatch = navigator.geolocation.watchPosition(acceptFix, () => lockEntry({ reason: "location" }), { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
            entryTimer = setInterval(() => {
              const result = WorldAccess.assess(entrance, lastFix);
              if (!result.allowed) lockEntry(result);
            }, 5000);
          } catch (error) {
            lockEntry({ reason: "location" });
            entryStatus.textContent = kids ? "ばしょが わかりません。おとなのひとと いちじょうほうの せっていを みてね。" : "現在地を確認できません。端末・ブラウザの位置情報を許可して、再確認してください。";
          } finally { entryButton.disabled = !entrance; }
        });
        document.addEventListener("visibilitychange", () => { if (document.hidden) lockEntry({ reason: "location" }); });
      }

      function isFudoWorld() {
        return /fudo/i.test(rawSrc) || /不動|Fudo/i.test(title);
      }

      function getWalkPoints() {
        if (/Katsuren_Future_Castle\.glb/i.test(rawSrc)) {
          return {
            gate: { label: "全体", target: "auto auto auto", orbit: "0deg 65deg auto", fov: "30deg" },
            front: { label: "正面", target: "auto auto auto", orbit: "0deg 85deg auto", fov: "30deg" },
          };
        }
        if (isFudoWorld()) {
          return {
            gate: { label: "全体", target: "0m 3m 0m", orbit: "0deg 65deg 80m", fov: "30deg" },
            front: { label: "正面", target: "0m 3m -4m", orbit: "0deg 75deg 40m", fov: "30deg" },
            floor1: { label: "参道", target: "0m 1m 6m", orbit: "-16deg 65deg 24m", fov: "30deg" },
            floor2: { label: "不動尊", target: "0m 4m -4.4m", orbit: "-18deg 80deg 20m", fov: "30deg" },
            item: { label: "瞑想の場", target: "7m 1m 4m", orbit: "22deg 65deg 18m", fov: "30deg" },
          };
        }
        return {
          gate: { label: "入口", target: "0m 1.6m 0m", orbit: "0deg 70deg 18m", fov: "30deg" },
          front: { label: "正面", target: "0m 2.4m -2m", orbit: "0deg 70deg 10m", fov: "28deg" },
          floor1: { label: "1階", target: "0m 2m -1m", orbit: "-18deg 72deg 12m", fov: "30deg" },
          floor2: { label: "2階", target: "0m 5.8m -3m", orbit: "-18deg 70deg 12m", fov: "30deg" },
          item: { label: "アイテム", target: "0m 5.8m -7m", orbit: "18deg 68deg 9m", fov: "26deg" },
        };
      }

      const walkPoints = getWalkPoints();

      function moveToWalkPoint(key, instant = false) {
        const point = walkPoints[key] || walkPoints.gate;
        if (!viewer || !point) return;
        viewer.cameraTarget = point.target;
        viewer.cameraOrbit = point.orbit;
        viewer.fieldOfView = point.fov;
        viewer.interpolationDecay = instant ? 200 : 80;
        walkButtons.forEach((button) => button.classList.toggle("active", button.dataset.walkPoint === key));
      }

      walkButtons.forEach((button) => {
        const point = walkPoints[button.dataset.walkPoint];
        button.hidden = !point;
        if (point) button.textContent = point.label;
        button.addEventListener("click", () => moveToWalkPoint(button.dataset.walkPoint));
      });
      function shouldShowDefaultItem() {
        return params.get("item") !== "none" && (/MANABI_Shibuya_3F/i.test(rawSrc) || /MANABI/i.test(title));
      }

      function addWorldItemHotspot() {
        if (!viewer || !modelSrc || !shouldShowDefaultItem()) return;
        const itemName = (params.get("itemName") || "2階のひみつアイテム").trim();
        const itemMessage = (params.get("itemText") || "2階に隠された探究アイテムを見つけました。現地で気づいたことを記録すると、この場所の謎がひとつ開きます。").trim();
        const position = (params.get("itemPosition") || (isFudoWorld() ? "0m 9.6m -8m" : "0m 5.8m -7m")).trim();
        const hotspot = document.createElement("button");
        hotspot.className = "world-item-hotspot";
        hotspot.type = "button";
        hotspot.slot = "hotspot-second-floor-item";
        hotspot.dataset.position = position;
        hotspot.dataset.normal = "0m 1m 0m";
        hotspot.dataset.visibilityAttribute = "visible";
        hotspot.innerHTML = "<span>ITEM</span>";
        hotspot.setAttribute("aria-label", itemName);
        hotspot.addEventListener("click", () => {
          itemTitle.textContent = itemName;
          itemText.textContent = itemMessage;
          itemPanel.classList.add("visible");
          try {
            localStorage.setItem(`wakuwaku-world-item:${modelSrc}:${itemName}`, new Date().toISOString());
          } catch {}
        });
        viewer.appendChild(hotspot);
      }

      viewer?.addEventListener("progress", (event) => { bar.style.width = `${event.detail.totalProgress * 100}%`; });
      viewer?.addEventListener("load", () => { bar.parentElement.hidden = true; moveToWalkPoint("gate", true); });
      itemClose?.addEventListener("click", () => itemPanel.classList.remove("visible"));
    </script>
    <script src="quest-items.js"></script>
    <script src="castle-quests.js"></script>
    <script src="quest-inventory.js"></script>
    <script>
      if (/\/(?:Katsuren_Future_Castle|fudo|MANABI_Shibuya_3F)\.glb$/i.test(new URL(modelSrc || ".", location.href).pathname)) {
        import("./castle-walk.js").catch(() => {
          const note = document.createElement("p");
          note.className = "hint";
          note.textContent = "歩行モードを読み込めませんでした。ページを開き直してください。";
          document.body.append(note);
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061b1c" />
    <title>不動坂の龍 | わくわくクエスト</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; overflow: hidden; color: #effff8; background: radial-gradient(circle at 50% 35%, #174a45 0, #081f21 38%, #030b0d 100%); }
      model-viewer { width: 100%; height: 100svh; --poster-color: transparent; }
      .topbar { position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
      .title { max-width: 72%; text-shadow: 0 2px 12px #000; }
      .title small, .title strong { display: block; }
      .title small { color: #b7e9d6; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
      .title strong { margin-top: 3px; font-size: clamp(22px, 7vw, 34px); }
      .back { pointer-events: auto; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; color: #fff; background: rgba(2,15,16,.68); text-decoration: none; backdrop-filter: blur(10px); }
      .hint { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); margin: auto; max-width: 520px; padding: 10px 14px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; color: #d7eee7; background: rgba(2,15,16,.66); font-size: 12px; line-height: 1.6; text-align: center; backdrop-filter: blur(12px); pointer-events: none; }
      .ar-button { position: fixed; z-index: 3; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); min-height: 54px; padding: 0 24px; border: 1px solid rgba(255,231,160,.7); border-radius: 999px; color: #fff; background: linear-gradient(135deg, #08745d, #c98416); box-shadow: 0 12px 32px rgba(0,0,0,.42); font: inherit; font-weight: 900; transform: translateX(-50%); white-space: nowrap; }
      .progress { position: absolute; left: 10%; right: 10%; bottom: 8px; height: 3px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.15); }
      .progress span { display: block; width: 0; height: 100%; background: #e8b742; transition: width .2s; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title"><small>FUDOZAKA AR ENCOUNTER</small><strong>不動坂の龍</strong></div>
      <a class="back" href="/" aria-label="地図へ戻る">×</a>
    </div>
    <model-viewer
      id="dragon"
      src="/assets/fudozaka-dragon.glb"
      poster="/assets/fudozaka-dragon-poster.png"
      alt="不動坂に現れる翡翠色の龍"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      camera-controls
      autoplay
      shadow-intensity="1.2"
      environment-image="neutral"
      exposure="1.1">
      <button class="ar-button" slot="ar-button">龍を現世に呼び出す</button>
      <div class="progress" slot="progress-bar"><span></span></div>
    </model-viewer>
    <p class="hint">安全な場所で立ち止まり、ボタンを押して地面をゆっくり映してください。道路上や通行の妨げになる場所では操作しないでください。</p>
    <script>
      const viewer = document.querySelector('#dragon');
      const bar = document.querySelector('.progress span');
      viewer.addEventListener('progress', (event) => { bar.style.width = `${event.detail.totalProgress * 100}%`; });
      viewer.addEventListener('load', () => { bar.parentElement.hidden = true; });
    </script>
  </body>
</html>

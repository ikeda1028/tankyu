<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>共通アバター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#22313d;font:16px system-ui}main{max-width:980px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px}button,a{font:inherit}button{cursor:pointer}#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}#choices button{border:2px solid #dce1e5;border-radius:8px;background:white;padding:12px;color:inherit}#choices button[aria-pressed=true]{border-color:#2267ce;background:#eaf2ff}img{display:block;width:100%;height:145px;object-fit:contain}button span{display:block;margin-top:8px}footer{display:flex;gap:12px;flex-wrap:wrap}footer button,#signin{border:0;border-radius:6px;padding:12px 18px;background:#2267ce;color:white}#status{min-height:48px;line-height:1.6}#account{color:#586875}a{color:#2267ce}button:disabled{opacity:.55;cursor:wait}
</style><main><header><h1>共通アバター</h1><a href="/">地図へ</a></header><p id="account">ログイン状態を確認中…</p><button id="signin" hidden>Googleでログイン</button><div id="choices" aria-label="アバターを選択"></div><p id="status" role="status"></p><footer><button id="save" disabled>保存してワールドへ</button><button id="local" hidden>この端末で使う</button></footer></main>
<script src="public-config.js"></script><script src="firebase-sync.js"></script><script type="module" src="world-avatar-picker.js"></script></html>
